[project]
name = "incident-investigator"
version = "0.1.0"
description = "Multi-agent production incident investigator"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.8.0",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "langgraph>=0.2",
    "pydantic>=2.7",
    "uvicorn>=0.54.0",
]

[project.scripts]
investigate = "incident_investigator.cli:main"
api = "incident_investigator.api:main"
eval = "incident_investigator.evaluation.runner:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_investigator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
